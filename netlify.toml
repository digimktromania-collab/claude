# Configurația Netlify — publică site-ul din dist/, asamblat de scriptul de build
[build]
  command = "bash scripts/build-dist.sh"
  publish = "dist"

# Cache lung pentru resursele statice (imagini, fonturi, librării)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/fonturi/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
