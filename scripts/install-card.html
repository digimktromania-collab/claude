<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:transparent;font-family:Inter,Helvetica,Arial,sans-serif}
.card{width:860px;height:640px;box-sizing:border-box;background:#FAF9F5;border-radius:36px;padding:44px;position:relative;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid #E8E4DA;border-radius:22px;padding:22px 28px;font-size:34px;font-weight:700;color:#1F1E1D}
.dots{width:68px;height:52px;border-radius:14px;background:#F0EDE5;display:flex;align-items:center;justify-content:center;gap:7px;border:3px solid #D97757}
.dots i{width:9px;height:9px;border-radius:50%;background:#1F1E1D;display:block}
.menu{position:absolute;right:44px;top:150px;width:520px;background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.14);border:2px solid #E8E4DA;padding:14px 0}
.row{display:flex;align-items:center;gap:22px;height:84px;padding:0 30px;font-size:34px;color:#3D3929}
.row b{width:40px;text-align:center;font-size:32px}
.hl{background:#FBEDE6;color:#1F1E1D;font-weight:700}
.sep{height:2px;background:#EEE;margin:8px 0}
.left{position:absolute;left:44px;top:170px;width:230px;display:flex;flex-direction:column;gap:22px}
.left div{height:26px;border-radius:13px;background:#E8E4DA}
</style></head><body><div class="card">
<div class="bar"><span>✳︎ Photo Resizer</span><div class="dots"><i></i><i></i><i></i></div></div>
<div class="left"><div style="width:220px"></div><div style="width:170px"></div><div style="width:200px"></div><div style="width:140px"></div><div style="width:190px"></div></div>
<div class="menu">
<div class="row"><b>⧉</b>Copy</div>
<div class="row"><b>⤓</b>Download</div>
<div class="row"><b>↗</b>Publish</div>
<div class="sep"></div>
<div class="row hl" id="install"><b>⊕</b>Install as app</div>
</div></div></body></html>
